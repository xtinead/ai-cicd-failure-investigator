
name: Investigator CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application
        run: python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest -v

      - name: Analyze synthetic IAM failure
        run: |
          pipeline-investigator \
            --log samples/iam_access_denied.log \
            --output reports

      - name: Upload investigation reports
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-investigation-report
          path: |
            reports/investigation.json
            reports/investigation.md
          retention-days: 7
          if-no-files-found: error
