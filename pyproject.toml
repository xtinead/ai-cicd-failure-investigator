
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-investigator"
version = "0.1.0"
description = "Reusable CI/CD pipeline failure investigation toolkit"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10"
]

[project.scripts]
pipeline-investigator = "pipeline_investigator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
